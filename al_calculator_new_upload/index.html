<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artlogic Pricing Calculator</title>
  <script src="calculator.js" defer></script>
</head>
<body>
  <h1>Artlogic Pricing Calculator</h1>
  <button id="calcBtn">Calculate</button>
  <div id="results">
    <div><strong>Monthly Total:</strong> <span id="monthlyTotal">0.00</span></div>
    <div><strong>Quarterly Total:</strong> <span id="quarterlyTotal">0.00</span></div>
    <div><strong>Annual Total:</strong> <span id="annualTotal">0.00</span></div>
    <div><strong>Total Discount:</strong> <span id="totalDiscount">0.00</span></div>
    <div><strong>Price Difference:</strong> <span id="priceDifference">0.00</span></div>
  </div>
</body>
</html>
